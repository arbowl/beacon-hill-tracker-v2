# Local Postgres for development and tests: docker compose up -d
name: beacon-hill-tracker-v2
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports: ["0.0.0.0:54329:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
    name: v2_pgdata
