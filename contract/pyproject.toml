[project]
name = "beacon-contract"
version = "1.0.0"
description = "Wire format for pushing evaluations to the Beacon Hill Compliance Tracker site"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beacon_contract"]
