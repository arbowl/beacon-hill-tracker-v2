[project]
name = "tracker"
version = "2.0.0"
description = "Beacon Hill Compliance Tracker site"
requires-python = ">=3.12"
dependencies = [
    "beacon-contract",
    "flask>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "tzdata>=2025.1",
    "gunicorn>=23.0; sys_platform != 'win32'",
    "itsdangerous>=2.2",
    "markdown-it-py>=4.3.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv.workspace]
members = ["contract"]

[tool.uv.sources]
beacon-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracker"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["beacon_contract", "tracker", "tests"]
